        title: "Hướng Dẫn Ôn Thi Tốt Nghiệp THPT Kỷ Nguyên Số 2026",
        content: `<strong>Cấu trúc đề thi Lịch Sử TN THPT 2026 chuẩn Bộ GD&ĐT:</strong><br><br>
        1. <strong>Phần I:</strong> Trắc nghiệm nhiều lựa chọn (24 câu - 6.0 điểm).<br>
        2. <strong>Phần II:</strong> Trắc nghiệm Đúng / Sai theo tư liệu lịch sử (4 câu - 16 ý - 4.0 điểm).<br><br>
        <strong>Mẹo làm bài:</strong> Nắm vững từ khóa thời gian, phân tích bản chất sự kiện, tư duy nguyên nhân - kết quả và kỹ năng đọc hiểu tư liệu gốc.`,
        target: "🎯 Đạt được: Làm chủ kiến thức Lịch Sử 12 Tập 1 và sẵn sàng chinh phục điểm 9+.",
        quiz: "💡 Luyện tập ngay: Mở công cụ QuizScanner Pro để giải các bộ đề thi thử Lịch Sử 2026 mới nhất!"
      }
    ];

    var currentPage = 0;

    function renderFlipBook() {
      var p1 = LICHSU12_TAP1_PAGES[currentPage] || {
        chapter: "KẾT THÚC",
        title: "Trang Cuối",
        content: "Bạn đã hoàn thành các bài học trong Sách Giáo Khoa Lịch Sử 12 - Tập 1.",
        target: "",
        quiz: ""
      };

      var p2 = LICHSU12_TAP1_PAGES[currentPage + 1] || {
        chapter: "GHI CHÚ",
        title: "Sổ Tay Ôn Tập",
        content: "Học sinh tự hệ thống sơ đồ tư duy thời gian sự kiện và luyện bài tập tự trắc nghiệm.",
        target: "",
        quiz: ""
      };

      // Trang trái
      document.getElementById('leftChapter').textContent = p1.chapter;
      document.getElementById('leftBody').innerHTML = `
        <h3>${p1.title}</h3>
        <p>${p1.content}</p>
        ${p1.target ? `<div class="box-target">${p1.target}</div>` : ''}
      `;
      document.getElementById('leftPageNum').textContent = "Trang " + (currentPage + 1);

      // Trang phải
      document.getElementById('rightChapter').textContent = p2.chapter;
      document.getElementById('rightBody').innerHTML = `
        <h3>${p2.title}</h3>
        <p>${p2.content}</p>
        ${p2.quiz ? `<div class="box-quiz">${p2.quiz}</div>` : ''}
      `;
      document.getElementById('rightPageNum').textContent = "Trang " + (currentPage + 2);

      document.getElementById('pageIndicator').textContent = `Trang ${currentPage + 1} - ${currentPage + 2} / ${LICHSU12_TAP1_PAGES.length}`;
      buildTocUI();
    }

    function buildTocUI() {
      var container = document.getElementById('tocListContainer');
      container.innerHTML = '';
      LICHSU12_TAP1_PAGES.forEach(function (item, idx) {
        var el = document.createElement('div');
        el.className = 'toc-item ' + (Math.floor(currentPage / 2) * 2 === idx ? 'active' : '');
        el.innerHTML = `<strong>Bài ${idx + 1}:</strong> ${item.title}`;
        el.addEventListener('click', function () {
          currentPage = Math.floor(idx / 2) * 2;
          renderFlipBook();
          document.getElementById('tocSidebar').classList.remove('open');
        });
        container.appendChild(el);
      });
    }

    // Events
    document.getElementById('prevBtn').addEventListener('click', function () {
      if (currentPage >= 2) { currentPage -= 2; renderFlipBook(); }
    });

    document.getElementById('nextBtn').addEventListener('click', function () {
      if (currentPage + 2 < LICHSU12_TAP1_PAGES.length) { currentPage += 2; renderFlipBook(); }
    });

    document.getElementById('firstPageBtn').addEventListener('click', function () {
      currentPage = 0; renderFlipBook();
    });

    document.getElementById('lastPageBtn').addEventListener('click', function () {
      currentPage = Math.floor((LICHSU12_TAP1_PAGES.length - 1) / 2) * 2; renderFlipBook();
    });

    document.getElementById('toggleTocBtn').addEventListener('click', function () {
      document.getElementById('tocSidebar').classList.toggle('open');
    });

    document.getElementById('closeTocBtn').addEventListener('click', function () {
      document.getElementById('tocSidebar').classList.remove('open');
    });

    // Run Initial
    renderFlipBook();
  </script>
</body>
</html>
