  <style>
    :root {
      --bg-primary: #02160e;
      --bg-card: rgba(6, 44, 30, 0.92);
      --border-color: rgba(16, 185, 129, 0.28);
      --emerald-300: #6ee7b7;
      --emerald-400: #34d399;
      --emerald-500: #10b981;
      --emerald-600: #059669;
      --text-main: #f0fdf4;
      --text-muted: #a7f3d0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(16, 185, 129, 0.18) 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(5, 150, 105, 0.15) 0%, transparent 50%),
        linear-gradient(180deg, #021a11 0%, #010f09 100%);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Topbar Header */
    .topbar {
      background: rgba(3, 30, 20, 0.95);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--emerald-500), var(--emerald-600));
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.88rem;
      transition: all 0.2s ease;
    }

    .btn:hover { background: linear-gradient(135deg, var(--emerald-400), var(--emerald-500)); transform: translateY(-1px); }
    .btn-secondary { background: rgba(6, 78, 59, 0.6); border: 1px solid var(--border-color); color: var(--text-main); }
    .btn-secondary:hover { background: rgba(6, 78, 59, 0.9); }

    /* Viewport Flipbook */
    .viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .book-container {
      width: 100%;
      max-width: 1180px;
      height: 92%;
      display: flex;
      background: #064e3b;
      border-radius: 12px;
      border: 4px solid #047857;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      overflow: hidden;
      position: relative;
    }

    .page-spread {
      flex: 1;
      background: #fdfbf7;
      color: #1e293b;
      padding: 28px 32px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
    }

    .page-spread.left {
      border-right: 2px solid #e2e8f0;
      box-shadow: inset -15px 0 20px rgba(0,0,0,0.05);
    }

    .page-spread.right {
      box-shadow: inset 15px 0 20px rgba(0,0,0,0.05);
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #cbd5e1;
      padding-bottom: 6px;
      font-size: 0.8rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
    }

    .page-body {
      flex: 1;
      margin-top: 14px;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.02rem;
      line-height: 1.8;
      color: #1e293b;
    }

    .page-body h3 {
      font-family: 'Inter', sans-serif;
      color: #064e3b;
      font-size: 1.25rem;
      margin-bottom: 12px;
      border-left: 4px solid var(--emerald-500);
      padding-left: 10px;
    }

    .box-target {
      background: rgba(6, 78, 59, 0.08);
      border-left: 3px solid #059669;
      padding: 12px;
      margin-top: 14px;
      font-size: 0.92rem;
      font-style: italic;
      font-family: 'Inter', sans-serif;
      border-radius: 4px;
    }

    .box-quiz {
      background: rgba(16, 185, 129, 0.08);
      border: 1px dashed #10b981;
      border-radius: 6px;
      padding: 12px;
      margin-top: 14px;
      font-size: 0.92rem;
      font-family: 'Inter', sans-serif;
    }

    .page-footer {
      border-top: 1px solid #e2e8f0;
      padding-top: 8px;
      margin-top: 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #064e3b;
      display: flex;
      justify-content: space-between;
    }

    /* Bottom Control Bar */
    .bottombar {
      background: rgba(3, 30, 20, 0.95);
      border-top: 1px solid var(--border-color);
      padding: 10px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    /* Sidebar Mục Lục */
    .toc-sidebar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -320px;
      width: 320px;
      background: rgba(3, 30, 20, 0.98);
      border-right: 1px solid var(--border-color);
      z-index: 50;
      transition: left 0.3s ease;
      padding: 18px;
      display: flex;
      flex-direction: column;
      box-shadow: 10px 0 30px rgba(0,0,0,0.7);
    }

    .toc-sidebar.open { left: 0; }

    .toc-item {
      padding: 10px 12px;
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      border-bottom: 1px solid rgba(16, 185, 129, 0.1);
    }

    .toc-item:hover, .toc-item.active {
      background: rgba(16, 185, 129, 0.2);
      color: #ffffff;
      border-left: 3px solid var(--emerald-400);
    }
  </style>

    var currentPage = 0;

    function renderFlipBook() {
      var p1 = NGUVAN12_TAP1_PAGES[currentPage] || {
        chapter: "KẾT THÚC",
        title: "Trang Cuối",
        content: "Bạn đã hoàn thành các bài học trong Sách Giáo Khoa Ngữ Văn 12 - Tập 1.",
        target: "",
        quiz: ""
      };

      var p2 = NGUVAN12_TAP1_PAGES[currentPage + 1] || {
        chapter: "GHI CHÚ",
        title: "Sổ Tay Đọc Hiểu",
        content: "Học sinh tự rèn luyện kỹ năng đọc hiểu văn bản ngoài SGK và viết đoạn văn nghị luận ngắn.",
        target: "",
        quiz: ""
      };

      // Trang trái
      document.getElementById('leftChapter').textContent = p1.chapter;
      document.getElementById('leftBody').innerHTML = `
        <h3>${p1.title}</h3>
        <p>${p1.content}</p>
        ${p1.target ? `<div class="box-target">${p1.target}</div>` : ''}
      `;
      document.getElementById('leftPageNum').textContent = "Trang " + (currentPage + 1);

      // Trang phải
      document.getElementById('rightChapter').textContent = p2.chapter;
      document.getElementById('rightBody').innerHTML = `
        <h3>${p2.title}</h3>
        <p>${p2.content}</p>
        ${p2.quiz ? `<div class="box-quiz">${p2.quiz}</div>` : ''}
      `;
      document.getElementById('rightPageNum').textContent = "Trang " + (currentPage + 2);

      document.getElementById('pageIndicator').textContent = `Trang ${currentPage + 1} - ${currentPage + 2} / ${NGUVAN12_TAP1_PAGES.length}`;
      buildTocUI();
    }

    function buildTocUI() {
      var container = document.getElementById('tocListContainer');
      container.innerHTML = '';
      NGUVAN12_TAP1_PAGES.forEach(function (item, idx) {
        var el = document.createElement('div');
        el.className = 'toc-item ' + (Math.floor(currentPage / 2) * 2 === idx ? 'active' : '');
        el.innerHTML = `<strong>Bài ${idx + 1}:</strong> ${item.title}`;
        el.addEventListener('click', function () {
          currentPage = Math.floor(idx / 2) * 2;
          renderFlipBook();
          document.getElementById('tocSidebar').classList.remove('open');
        });
        container.appendChild(el);
      });
    }

    // Events
    document.getElementById('prevBtn').addEventListener('click', function () {
      if (currentPage >= 2) { currentPage -= 2; renderFlipBook(); }
    });

    document.getElementById('nextBtn').addEventListener('click', function () {
      if (currentPage + 2 < NGUVAN12_TAP1_PAGES.length) { currentPage += 2; renderFlipBook(); }
    });

    document.getElementById('firstPageBtn').addEventListener('click', function () {
      currentPage = 0; renderFlipBook();
    });

    document.getElementById('lastPageBtn').addEventListener('click', function () {
      currentPage = Math.floor((NGUVAN12_TAP1_PAGES.length - 1) / 2) * 2; renderFlipBook();
    });

    document.getElementById('toggleTocBtn').addEventListener('click', function () {
      document.getElementById('tocSidebar').classList.toggle('open');
    });

    document.getElementById('closeTocBtn').addEventListener('click', function () {
      document.getElementById('tocSidebar').classList.remove('open');
    });

    // Run Initial
    renderFlipBook();
  </script>
</body>
</html>
